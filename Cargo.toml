[package]
name = "apolline-scene"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "A renderer for Wallpaper Engine scenes, in Rust on GLES, written clean-room"
repository = "https://github.com/Pisosenie/apolline-scene"

[dependencies]
libc = "0.2"
glow = "0.16"
serde_json = "1"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "bmp", "tga"] }
lz4_flex = { version = "0.11", default-features = false, features = ["std", "safe-decode"] }

[dev-dependencies]
glutin = "0.32"
glutin-winit = "0.5"
raw-window-handle = "0.6"
winit = "0.30"
